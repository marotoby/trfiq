# For running the server on the host (scripts/cargo.sh run …) against the dev S3 server
# from `deploy/dev-s3.sh`, plus the generated samples as a local folder.
listen: 127.0.0.1:8080
data_dir: data/state
scan_interval_secs: 60

sources:
  - id: s3
    name: S3 (dev)
    kind: s3
    endpoint: http://127.0.0.1:9000
    bucket: recordings
    access_key_id: ${S3_ACCESS_KEY_ID:-trfiq}
    secret_access_key: ${S3_SECRET_ACCESS_KEY:-trfiq-dev-secret}
  - id: local
    name: Local samples
    kind: local
    path: data/samples
