[workspace]
resolver = "3"
members = ["crates/dsp", "crates/storage", "crates/index", "crates/server"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
trfiq-dsp = { path = "crates/dsp" }
trfiq-storage = { path = "crates/storage" }
trfiq-index = { path = "crates/index" }

anyhow = "1"
thiserror = "2"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
object_store = { version = "0.12", features = ["aws"] }
rustfft = "6"
rayon = "1"
num-complex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4

# Keep DSP tests fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
